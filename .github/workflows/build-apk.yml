# ?꾨줎??repo ?⑤룆 諛고룷 ?? mini_flutter/ 媛 repo 猷⑦듃???덉뼱???⑸땲??

name: Flutter APK 鍮뚮뱶 (frontend repo)

on:
  push:
    branches: [main]
    paths:
      - 'mini_flutter/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

# APK push 쨌 build-tail push媛 ?숈떆??main??嫄대뱶由ъ? ?딅룄濡?吏곷젹??concurrency:
  group: build-apk-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter ?꾨줈?앺듃 ?뺤씤
        run: test -d mini_flutter || (echo "::error::mini_flutter/ ?대뜑媛 repo 猷⑦듃???꾩슂?⑸땲?? && exit 1)

      - name: Android Gradle 쨌 wrapper ?숆린??(Flutter stable)
        run: |
          set -e
          cp mini_flutter/android/app/src/main/AndroidManifest.xml /tmp/chungsora_manifest.xml
          cp -r mini_flutter/android/app/src/main/kotlin/com/chungsora/child /tmp/chungsora_kotlin
          cp mini_flutter/android/app/src/main/res/xml/device_admin.xml /tmp/device_admin.xml 2>/dev/null || true
          flutter create /tmp/chungsora_ref --org com.chungsora --project-name chungsora_ref --platforms android
          REF=/tmp/chungsora_ref/android
          DST=mini_flutter/android
          cp "$REF/settings.gradle.kts" "$DST/settings.gradle.kts"
          cp "$REF/gradle/wrapper/"* "$DST/gradle/wrapper/"
          cp "$REF/gradlew" "$DST/gradlew"
          cp "$REF/gradlew.bat" "$DST/gradlew.bat"
          cp "$REF/build.gradle.kts" "$DST/build.gradle.kts"
          cp "$REF/gradle.properties" "$DST/gradle.properties"
          cp "$REF/app/build.gradle.kts" "$DST/app/build.gradle.kts"
          # launcher mipmap ??由ъ냼??(?섎룞 scaffold???놁쓬)
          mkdir -p "$DST/app/src/main/res"
          cp -r "$REF/app/src/main/res/"* "$DST/app/src/main/res/"
          # 而ㅼ뒪? DPC manifest 쨌 Kotlin 쨌 device_admin ?좎?
          test -f /tmp/chungsora_manifest.xml && cp /tmp/chungsora_manifest.xml "$DST/app/src/main/AndroidManifest.xml"
          test -d /tmp/chungsora_kotlin && cp -r /tmp/chungsora_kotlin/* "$DST/app/src/main/kotlin/com/chungsora/child/"
          mkdir -p "$DST/app/src/main/res/xml"
          test -f /tmp/device_admin.xml && cp /tmp/device_admin.xml "$DST/app/src/main/res/xml/device_admin.xml"
          # ??ID 쨌 namespace 쨌 minSdk ?좎?
          sed -i 's/com\.chungsora\.chungsora_ref/com.chungsora.child/g' "$DST/app/build.gradle.kts"
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$DST/app/build.gradle.kts"
          # Flutter stable + ?뚮윭洹몄씤 ?명솚: Kotlin 1.9.x 怨좎젙 (2.x??compileReleaseKotlin ?ㅽ뙣 媛??
          sed -i 's/org.jetbrains.kotlin.android") version "[^"]*"/org.jetbrains.kotlin.android") version "1.9.24"/' "$DST/settings.gradle.kts"
          chmod +x "$DST/gradlew"
          flutter --version

      - working-directory: mini_flutter
        run: flutter create . --platforms=android --org com.chungsora --project-name chungsora_child

      - working-directory: mini_flutter
        run: flutter pub get

      - name: Dart analyze
        working-directory: mini_flutter
        run: |
          flutter analyze 2>&1 | tee ../analyze.log
          if grep -q "error ?? ../analyze.log; then
            grep "error ?? ../analyze.log
            exit 1
          fi

      - name: APK 鍮뚮뱶
        working-directory: mini_flutter
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee ../build-apk.log
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: 鍮뚮뱶 濡쒓렇 artifact (?ㅽ뙣 ??
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-log
          path: build-apk.log
          retention-days: 14

      - name: ?꾩껜 鍮뚮뱶 濡쒓렇 怨듦컻 (?ㅽ뙣 ??
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Flutter APK build failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "e: file://|error ??FAILURE:|What went wrong|Compilation error" build-apk.log | tail -n 40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cp build-apk.log public/full-build-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/full-build-error.txt
          git diff --staged --quiet && exit 0
          git commit -m "ci: full build log [skip ci]"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin main
          git rebase origin/main || true
          git push "$REMOTE" HEAD:main || true

      - run: mkdir -p public/apk

      - name: APK 쨌 version.json 蹂듭궗
        run: |
          cp mini_flutter/build/app/outputs/flutter-apk/app-release.apk public/apk/app-release.apk
          VERSION=$(grep '^version:' mini_flutter/pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VER_NAME="${VERSION%%+*}"
          VER_CODE="${VERSION##*+}"
          APK_PATH="public/apk/app-release.apk"
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          cat > public/apk/version.json << EOF
          {
            "version": "${VER_NAME}",
            "build_number": "${VER_CODE}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "package": "com.chungsora.child",
            "apk_size_bytes": ${APK_SIZE}
          }
          EOF
          echo "APK_VERSION=${VER_NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: chungsora-child-apk
          path: |
            public/apk/app-release.apk
            public/apk/version.json

      - name: build-tail 쨌 public/apk ?⑥씪 而ㅻ컠 쨌 push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          {
            echo "=== Dart analyze errors ==="
            grep "error ?? analyze.log 2>/dev/null || true
            echo "=== Gradle/Kotlin errors ==="
            grep -E "^(FAILURE:|\\* What went wrong|Execution failed|e: file|error: |> Task :app:)" build-apk.log 2>/dev/null || true
            grep -E "e: file://|Unresolved reference|Compilation error|No value passed for parameter" build-apk.log 2>/dev/null | head -n 30 || true
            grep -E "\.dart:[0-9]+:[0-9]+:" build-apk.log analyze.log 2>/dev/null || true
            echo ""
            echo "=== Last 80 lines ==="
            tail -n 80 build-apk.log || true
          } > public/build-tail.txt

          git add public/apk/ public/build-tail.txt
          if git diff --staged --quiet; then
            echo "::error::APK媛 staging?섏? ?딆븯?듬땲??
            exit 1
          fi
          git commit -m "chore(apk): release ${APK_VERSION} [skip ci]"

          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push "$REMOTE" HEAD:main; then
              echo "push succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}/5), retrying..."
            sleep $((attempt * 3))
          done
          echo "::error::git push failed after 5 attempts"
          exit 1
