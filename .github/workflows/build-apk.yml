# 프론트 repo 단독 배포 시: mini_flutter/ 가 repo 루트에 있어야 합니다.

name: Flutter APK 빌드 (frontend repo)

on:
  push:
    branches: [main]
    paths:
      - 'mini_flutter/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter 프로젝트 확인
        run: test -d mini_flutter || (echo "::error::mini_flutter/ 폴더가 repo 루트에 필요합니다" && exit 1)

      - name: Android Gradle · wrapper 동기화 (Flutter stable)
        run: |
          set -e
          cp mini_flutter/android/app/src/main/AndroidManifest.xml /tmp/chungsora_manifest.xml
          cp -r mini_flutter/android/app/src/main/kotlin/com/chungsora/child /tmp/chungsora_kotlin
          cp mini_flutter/android/app/src/main/res/xml/device_admin.xml /tmp/device_admin.xml 2>/dev/null || true
          flutter create /tmp/chungsora_ref --org com.chungsora --project-name chungsora_ref --platforms android
          REF=/tmp/chungsora_ref/android
          DST=mini_flutter/android
          cp "$REF/settings.gradle.kts" "$DST/settings.gradle.kts"
          cp "$REF/gradle/wrapper/"* "$DST/gradle/wrapper/"
          cp "$REF/gradlew" "$DST/gradlew"
          cp "$REF/gradlew.bat" "$DST/gradlew.bat"
          cp "$REF/build.gradle.kts" "$DST/build.gradle.kts"
          cp "$REF/gradle.properties" "$DST/gradle.properties"
          cp "$REF/app/build.gradle.kts" "$DST/app/build.gradle.kts"
          # launcher mipmap 등 리소스 (수동 scaffold에 없음)
          mkdir -p "$DST/app/src/main/res"
          cp -r "$REF/app/src/main/res/"* "$DST/app/src/main/res/"
          # 커스텀 DPC manifest · Kotlin · device_admin 유지
          test -f /tmp/chungsora_manifest.xml && cp /tmp/chungsora_manifest.xml "$DST/app/src/main/AndroidManifest.xml"
          test -d /tmp/chungsora_kotlin && cp -r /tmp/chungsora_kotlin/* "$DST/app/src/main/kotlin/com/chungsora/child/"
          mkdir -p "$DST/app/src/main/res/xml"
          test -f /tmp/device_admin.xml && cp /tmp/device_admin.xml "$DST/app/src/main/res/xml/device_admin.xml"
          # 앱 ID · namespace · minSdk 유지
          sed -i 's/com\.chungsora\.chungsora_ref/com.chungsora.child/g' "$DST/app/build.gradle.kts"
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$DST/app/build.gradle.kts"
          chmod +x "$DST/gradlew"
          flutter --version

      - working-directory: mini_flutter
        run: flutter create . --platforms=android --org com.chungsora --project-name chungsora_child

      - working-directory: mini_flutter
        run: flutter pub get

      - name: Dart analyze
        working-directory: mini_flutter
        run: |
          flutter analyze 2>&1 | tee ../analyze.log
          if grep -q "error •" ../analyze.log; then
            grep "error •" ../analyze.log
            exit 1
          fi

      - name: APK 빌드
        working-directory: mini_flutter
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee ../build-apk.log || true
          echo "--- tail ---"
          tail -n 100 ../build-apk.log
          grep -iE "error:|FAILURE:|exception|What went wrong" ../build-apk.log | tail -n 30 || true
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: 빌드 로그 (실패 시)
        if: failure()
        run: |
          echo "## Flutter APK build failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 150 build-apk.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cp build-apk.log mini_flutter/LAST_BUILD_ERROR.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mini_flutter/LAST_BUILD_ERROR.log
          git commit -m "debug: upload build log [skip ci]" || true
          git push origin HEAD:main || true

      - run: mkdir -p public/apk

      - name: APK · version.json 복사
        run: |
          cp mini_flutter/build/app/outputs/flutter-apk/app-release.apk public/apk/app-release.apk
          VERSION=$(grep '^version:' mini_flutter/pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VER_NAME="${VERSION%%+*}"
          VER_CODE="${VERSION##*+}"
          APK_PATH="public/apk/app-release.apk"
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          cat > public/apk/version.json << EOF
          {
            "version": "${VER_NAME}",
            "build_number": "${VER_CODE}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "package": "com.chungsora.child",
            "apk_size_bytes": ${APK_SIZE}
          }
          EOF
          echo "APK_VERSION=${VER_NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: chungsora-child-apk
          path: |
            public/apk/app-release.apk
            public/apk/version.json

      - name: public/apk 커밋 · push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apk/
          if git diff --staged --quiet; then
            echo "::error::APK가 staging되지 않았습니다"
            exit 1
          fi
          git commit -m "chore(apk): release ${APK_VERSION} [skip ci]"
          git push origin HEAD:main

      - name: 빌드 로그 공개 (항상)
        if: always()
        run: |
          {
            echo "=== Dart analyze errors ==="
            grep "error •" analyze.log 2>/dev/null || true
            echo "=== Gradle/Kotlin errors ==="
            grep -E "^(FAILURE:|\\* What went wrong|Execution failed|e: file|error: |> Task :app:)" build-apk.log 2>/dev/null || true
            grep -E "e: file://|Unresolved reference|Compilation error" build-apk.log 2>/dev/null | head -n 20 || true
            grep -E "\.dart:[0-9]+:[0-9]+:" build-apk.log analyze.log 2>/dev/null || true
            echo ""
            echo "=== Last 80 lines ==="
            tail -n 80 build-apk.log || true
          } > public/build-tail.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/build-tail.txt
          git diff --staged --quiet && exit 0
          git commit -m "ci: build tail [skip ci]"
          git push origin HEAD:main
