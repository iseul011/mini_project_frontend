    <script type="text/babel">
const { useState, useRef, useEffect } = React;

// 가구 표준 규격 프리셋 데이터 정의
const FURNITURE_CATEGORIES = {

// 프로토타입 즉시 테스트를 위한 고화질 방 사진 프리셋

// 커머스 제휴 모델 (B2C Affiliate) 시뮬레이션용 추천 상품 데이터
const COMMERCE_MOCK_DATA = {
  bed: [
    { brand: '지누스', name: '스마트베이스 침대 프레임', price: '129,000원', img: 'https://images.unsplash.com/photo-1505693314120-0d443867891c?auto=format&fit=crop&w=150&q=80', badge: '오늘출발' },
    { brand: '동서가구', name: '원목 평상형 침대', price: '198,000원', img: 'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=150&q=80', badge: '베스트' },
  ],
  drawer: [

  ],
  desk: [
    { brand: '데스커', name: '베이직 데스크 세트', price: '145,000원', img: 'https://images.unsplash.com/photo-1518455027359-f3f8164ba6bd?auto=format&fit=crop&w=150&q=80', badge: '국민템' },
  ],
  sofa: [
    { brand: '에싸', name: '패브릭 3인용 모듈 소파', price: '650,000원', img: 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=150&q=80', badge: '특가' },
  ],
  unknown: [
    { brand: '스페이스핏', name: '공간 맞춤 인기상품 모아보기', price: '할인중', img: 'https://images.unsplash.com/photo-1583847268964-b28ce8f89f86?auto=format&fit=crop&w=150&q=80', badge: '추천' },
  ]
};

function App() {
  // 앱 전체 단계 상태 관리 (scanning: 스캔 체험 단계, workspace: 실제 배치 작업실)
  const [appStage, setAppStage] = useState('scanning'); 
  const [scanProgress, setScanProgress] = useState(0);
  const [scanStatusText, setScanStatusText] = useState('바닥 평면 감지 센서 초기화 중...');

  // 가상 스토어 뷰 상태 추가
  const [showStoreModal, setShowStoreModal] = useState(false);

  // 방 스케일 관련 상태 (추가)
  const [roomPyeong, setRoomPyeong] = useState(5);
  const [pixelsPerCm, setPixelsPerCm] = useState(1);

  // 캔버스 배경 및 가구 관리 상태
  const [bgImage, setBgImage] = useState(PRESET_ROOMS[0].url);
  const [furnitureList, setFurnitureList] = useState([
    {
      id: 'initial-bed',
      name: '퀸 침대 (Q)',
      type: 'bed',
      realWidth: 150, // 실제 기준 폭 cm
      realHeight: 200, // 실제 기준 높이 cm
      x: 100, // 좌측 위치
      y: 120, // 상측 위치
      rotation: 0, // 회전각
      color: 'from-blue-500 to-indigo-600',
      opacity: 0.85,
      scaleX: 1, // 리사이즈 배율
      scaleY: 1
    }
  ]);
  const [selectedId, setSelectedId] = useState('initial-bed');
  const [showGrid, setShowGrid] = useState(true);
  const [customFileLoading, setCustomFileLoading] = useState(false);

  // 드래그/회전/리사이즈 상호작용 관련 로컬 Ref (React state 변경 빈도로 인한 성능 저하 방지)
  const canvasRef = useRef(null);
  const interactionRef = useRef({
    isInteracting: false,
    mode: null, // 'move', 'resize', 'rotate'
    targetId: null,
    startX: 0,
    startY: 0,
    startItemX: 0,
    startItemY: 0,
    startRealWidth: 0,
    startRealHeight: 0,
    startRotation: 0,
    startPixelsPerCm: 1,
  });

  // ⚡ URL Query Trigger Parser for RoomQuest AI Integration
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const trigger = params.get('trigger');
    
    if (trigger) {
      setAppStage('workspace'); // Bypass scanning MVP and load workspace instantly!
      
      if (trigger === 'book') {
        const newFurniture = {
          id: 'trigger-bookshelf',
          name: '데스커 3단 책꽂이 (추천)',
          type: 'drawer',
          realWidth: 120,
          realHeight: 40,
          x: 150,
          y: 200,
          rotation: 0,
          color: 'from-emerald-500 to-teal-600',
          opacity: 0.9,
          scaleX: 1,
          scaleY: 1
        };
        setFurnitureList([newFurniture]);
        setSelectedId('trigger-bookshelf');
      } else if (trigger === 'backpack') {
        const newFurniture = {
          id: 'trigger-hanger',
          name: '한샘 원목 A형 행거 (추천)',
          type: 'drawer',
          realWidth: 80,
          realHeight: 50,
          x: 180,
          y: 180,
          rotation: 0,
          color: 'from-amber-500 to-orange-600',
          opacity: 0.9,
          scaleX: 1,
          scaleY: 1
        };
        setFurnitureList([newFurniture]);
        setSelectedId('trigger-hanger');
      } else if (trigger === 'cup' || trigger === 'bottle') {
        const newFurniture = {
          id: 'trigger-organizer',
          name: '스마트 다용도 선반 (추천)',
          type: 'drawer',
          realWidth: 60,
          realHeight: 40,
          x: 200,
          y: 150,
          rotation: 0,
          color: 'from-purple-500 to-pink-600',
          opacity: 0.9,
          scaleX: 1,
          scaleY: 1
        };
        setFurnitureList([newFurniture]);
        setSelectedId('trigger-organizer');
      }
    }
  }, []);

  // 0. 캔버스 및 평수 기반 스케일(pixelsPerCm) 계산
  useEffect(() => {
    if (appStage !== 'workspace') return;
    
    const updateScale = () => {
      if (!canvasRef.current) return;
      const rect = canvasRef.current.getBoundingClientRect();
      // 캔버스의 대략 60% 면적을 바닥(Floor)으로 간주
      const floorAreaPx = rect.width * rect.height * 0.6;
      // 1평 = 약 3.3m^2 = 33000 cm^2
      const roomAreaCm2 = roomPyeong * 33000;
      
      const newScale = Math.sqrt(floorAreaPx / roomAreaCm2);
      setPixelsPerCm(newScale);
    };

    // 약간의 지연을 주어 렌더링 후 DOM 크기를 정확히 가져오도록 함
    setTimeout(updateScale, 50);
    window.addEventListener('resize', updateScale);
    return () => window.removeEventListener('resize', updateScale);
  }, [roomPyeong, appStage]);

  // 1. 가상 스캔 시뮬레이터 효과 구현
  useEffect(() => {
    if (appStage !== 'scanning') return;

    const timer = setInterval(() => {
      setScanProgress((prev) => {
        const next = prev + 1;
        
        // 진행 단계별 가이드 텍스트 변경 (플레이스보 효과 극대화)
        if (next === 20) setScanStatusText('바닥 자이로 센서 연동 성공. 카메라 바닥 스캔 중...');
        if (next === 45) setScanStatusText('공간 격자망 측정 포인트 수집 중 (402/1000)...');
        if (next === 70) setScanStatusText('방 조도 확인 및 3D 수평 원근 기준선 앵커 고정 완료!');
        if (next === 90) setScanStatusText('배치 공간 매칭 연산 완료! 가상 스티커 시스템을 구축합니다.');

        if (next >= 100) {
          clearInterval(timer);
          setTimeout(() => {
            setAppStage('workspace');
          }, 800);
          return 100;
        }
        return next;
      });
    }, 40); // 약 4초 동안 스캔 시뮬레이션

    return () => clearInterval(timer);
  }, [appStage]);

  // 마우스/터치 통합 포인터 이벤트 핸들러 구현 (반응형 모바일 지원 극대화)
  const handlePointerDown = (e, item, mode) => {
    e.stopPropagation();
    // 마우스 우클릭 등 방지 및 포인터 캡처
    if (e.button && e.button !== 0) return;
    
    setSelectedId(item.id);
    const canvas = canvasRef.current;
    if (!canvas) return;

    const canvasRect = canvas.getBoundingClientRect();
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);

    interactionRef.current = {
      isInteracting: true,
      mode: mode, // 'move' | 'resize' | 'rotate'
      targetId: item.id,
      startX: clientX,
      startY: clientY,
      startItemX: item.x,
      startItemY: item.y,
      startRealWidth: item.realWidth,
      startRealHeight: item.realHeight,
      startRotation: item.rotation,
      startPixelsPerCm: pixelsPerCm,
    };

    // 전역 이벤트 리스너 등록 (부드러운 이탈 드래깅 처리)
    document.addEventListener('pointermove', handlePointerMove);
    document.addEventListener('pointerup', handlePointerUp);
  };

  const handlePointerMove = (e) => {
    const interaction = interactionRef.current;
    if (!interaction.isInteracting) return;

    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);

    const deltaX = clientX - interaction.startX;
    const deltaY = clientY - interaction.startY;

    setFurnitureList((prevList) =>
      prevList.map((item) => {
        if (item.id !== interaction.targetId) return item;

        if (interaction.mode === 'move') {
          // 범위 밖으로 튀지 않도록 마진 처리
          return {
            ...item,
            x: Math.max(-50, Math.min(600, interaction.startItemX + deltaX)),
            y: Math.max(-50, Math.min(600, interaction.startItemY + deltaY)),
          };
        } else if (interaction.mode === 'resize') {
          // 크기 조절 (최소 가로세로 30px 제한)
          const startPxWidth = interaction.startRealWidth * interaction.startPixelsPerCm;
          const startPxHeight = interaction.startRealHeight * interaction.startPixelsPerCm;
          
          const newPxWidth = Math.max(30, startPxWidth + deltaX);
          const newPxHeight = Math.max(30, startPxHeight + deltaY);

          return {
            ...item,
            realWidth: newPxWidth / pixelsPerCm,
            realHeight: newPxHeight / pixelsPerCm,
          };
        } else if (interaction.mode === 'rotate') {
          // 회전 중심점 계산 및 삼각함수 아크탄젠트 활용한 회전 제어
          const element = document.getElementById(item.id);
          if (!element) return item;
          const rect = element.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          
          const angleRad = Math.atan2(clientY - centerY, clientX - centerX);
          let angleDeg = angleRad * (180 / Math.PI) - 90; // 상단 꼭대기 기준 오프셋 90도 보정
          if (angleDeg < 0) angleDeg += 360;

          return {
            ...item,
            rotation: Math.round(angleDeg),
          };
        }
        return item;
      })
    );
  };

  const handlePointerUp = () => {
    interactionRef.current.isInteracting = false;
    document.removeEventListener('pointermove', handlePointerMove);
    document.removeEventListener('pointerup', handlePointerUp);
  };

  // 새로운 가구를 화면 중앙에 생성하는 함수
  const addNewFurniture = (preset) => {
    const newId = `furn-${Date.now()}`;
    const newItem = {
      id: newId,
      name: preset.name,
      type: preset.type || 'unknown',
      realWidth: preset.width,
      realHeight: preset.height,
      x: 120 + Math.random() * 20, // 겹치지 않게 무작위 가산 오프셋
      y: 120 + Math.random() * 20,
      rotation: 0,
      color: preset.color || 'from-slate-400 to-slate-600',
      opacity: 0.85,
    };
    setFurnitureList((prev) => [...prev, newItem]);
    setSelectedId(newId);
  };

  // 배경 이미지 처리
  const handleImageUpload = (e) => {
    const file = e.target.files[0];
    if (file) {
      setCustomFileLoading(true);
      const reader = new FileReader();
      reader.onload = (event) => {
        setBgImage(event.target.result);
        setCustomFileLoading(false);
      };
      reader.readAsDataURL(file);
    }
  };

  // 선택된 항목 삭제
  const deleteSelected = () => {
    setFurnitureList((prev) => prev.filter((item) => item.id !== selectedId));
    setSelectedId(null);
  };

  // 불투명도 조절
  const updateOpacity = (val) => {
    setFurnitureList((prev) =>
      prev.map((item) => (item.id === selectedId ? { ...item, opacity: parseFloat(val) } : item))
    );
  };

  return (
    <div className="min-h-screen bg-slate-900 text-slate-100 font-sans flex flex-col selection:bg-indigo-500 selection:text-white">
      
      {/* 글로벌 네비게이션 헤더 */}
      <header className="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md px-6 py-4 sticky top-0 z-50 flex items-center justify-between">
        <div className="flex items-center space-x-3">
          <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
            <span className="text-xl font-bold text-white">S</span>
          </div>
          <div>
            <h1 className="text-lg font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
              스페이스핏 AI <span className="text-xs text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded-full border border-indigo-500/20 ml-2 font-normal">MVP 5일 완성</span>
            </h1>
            <p className="text-xs text-slate-400 hidden sm:block">AI인 척 똑똑하게 속도를 당기는 극강의 편의성 프로토타입</p>
          </div>
        </div>
        <div className="flex items-center space-x-3">
          <button
            onClick={() => {
              setAppStage('scanning');
              setScanProgress(0);
            }}
            className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium px-3 py-2 rounded-lg transition"
          >
            🔄 다시 스캔 체험하기
          </button>
          <a
            href="https://placehold.co"
            target="_blank"
            rel="noopener noreferrer"
            className="text-xs text-indigo-400 hover:underline hidden md:block"
          >
            Guide v1.2
          </a>
        </div>
      </header>

      {/* 가상 스캔 시뮬레이션 화면 (체험 연출 ②번 기획) */}
      {appStage === 'scanning' && (
        <div className="flex-1 flex flex-col items-center justify-center p-6 bg-radial-gradient from-slate-950 to-slate-900 relative overflow-hidden">
          {/* 하이테크 레이아웃 데코 그리드 */}
          <div className="absolute inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] opacity-30" />
          
          <div className="max-w-md w-full bg-slate-950/90 border border-slate-800 rounded-2xl p-8 shadow-2xl relative z-10 text-center space-y-8">
            <div className="space-y-2">
              <span className="text-xs text-emerald-400 font-bold tracking-widest uppercase bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">
                Spatial Scan Mock AI
              </span>
              <h2 className="text-2xl font-bold mt-2">공간 앵커 매핑 활성화</h2>
              <p className="text-sm text-slate-400">
                스마트폰의 정밀 관성 측정 장치(IMU)와 카메라 원근법을 매칭하여 방 규격을 수립하고 있습니다.
              </p>
            </div>

            {/* 고품질 레이저 스캔 애니메이션 시각화 */}

                  <span className="text-[10px] text-slate-400 font-bold">배치 리스트 요약:</span>
                  <div className="max-h-[140px] overflow-y-auto space-y-1 pr-1">
                    {furnitureList.map((item, idx) => (
                      <div key={item.id} className="text-[11px] text-slate-300 flex justify-between bg-slate-950 p-1.5 rounded border border-slate-800/80">
                        <span className="truncate max-w-[150px]">{idx + 1}. {item.name}</span>
                        <span className="font-mono text-slate-400">{Math.round(item.realWidth)}x{Math.round(item.realHeight)}</span>
                      </div>
                    ))}
                    {furnitureList.length === 0 && (
                      <span className="text-xs text-slate-500 block py-2">배치된 내역이 없습니다.</span>
                    )}
                  </div>
                </div>
              </div>
            </div>

            {/* B2C 제휴 마케팅 모델 데모 렌더링 영역 */}
            {selectedId && furnitureList.find(i => i.id === selectedId) && (
              <div className="space-y-3 animate-[fadeIn_0.3s_ease-out]">
                <h3 className="text-sm font-semibold text-pink-400 flex items-center gap-1.5">
                  🛒 이 규격에 맞는 추천 상품
                </h3>
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-3 shadow-lg shadow-pink-900/10">
                  <div className="text-[11px] text-slate-400 mb-2 leading-relaxed">
                    <strong className="text-slate-200">{furnitureList.find(i => i.id === selectedId).name}</strong> ({Math.round(furnitureList.find(i => i.id === selectedId).realWidth)}cm) 사이즈가 쏙 들어가는 오늘의집 베스트 상품입니다.
                  </div>
                  
                  <div className="space-y-2">
                    {(COMMERCE_MOCK_DATA[furnitureList.find(i => i.id === selectedId).type] || COMMERCE_MOCK_DATA['unknown']).map((prod, idx) => (
                      <a
                        key={idx}
                        href="https://ohou.se"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="flex items-center gap-3 p-2.5 rounded-lg bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-pink-500/40 transition group cursor-pointer"
                      >
                        <div className="w-12 h-12 rounded-md overflow-hidden bg-slate-800 shrink-0 border border-slate-700">
                          <img src={prod.img} alt={prod.name} className="w-full h-full object-cover group-hover:scale-110 transition duration-300" />
                        </div>
                        <div className="flex-1 min-w-0">
                          <div className="text-[9px] text-slate-500 mb-0.5">{prod.brand}</div>
                          <div className="text-[11px] text-slate-200 font-medium truncate">{prod.name}</div>
                          <div className="text-xs text-pink-400 font-bold mt-0.5 flex items-center gap-1.5">
                            {prod.price}
                            <span className="text-[8px] px-1 py-0.5 bg-pink-500/10 text-pink-400 rounded border border-pink-500/20 font-normal">{prod.badge}</span>
                          </div>
                        </div>
                      </a>
                    ))}
                  </div>
                  <button 
                    onClick={() => setShowStoreModal(true)}
                    className="w-full py-2 mt-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] rounded-lg transition font-medium"
                  >
                    비슷한 상품 120개 더보기
                  </button>
                </div>
              </div>
            )}

            {/* AI 편의 기능 기획 가이드 요약 가이드박스 */}
            <div className="p-4 rounded-xl bg-indigo-950/40 border border-indigo-900/30 space-y-2">
              <h4 className="text-xs font-bold text-indigo-300">💡 5일 기획 핵심 구현 가이드</h4>
              <p className="text-[11px] text-indigo-200/80 leading-relaxed">
                사용자의 숫자를 일일이 입력해야 하는 피로를 제거하고, 오직 <strong>‘클릭’</strong>과 <strong>‘드래그 크기 매칭’</strong> 두 개로 압축했습니다. 
              </p>
              <p className="text-[11px] text-indigo-200/80 leading-relaxed">
                스마트 자이로 센서 스캔 화면을 연출하여 초기 이탈을 방지하고 체험 만족도를 크게 늘리는 플레이스보 기법이 프로토타입에 기본 적용되었습니다.
              </p>
            </div>

            {/* 액션 다운로드/공유하기 시뮬레이션 */}
            <div className="space-y-2">
              <button
                onClick={() => {
                  // 임베드용 임시 클립보드 복사 시뮬레이션
                  const dummyText = `[스페이스핏 AI 가구 배치 요약]\n${furnitureList.map((i) => `- ${i.name} (${Math.round(i.realWidth)}x${Math.round(i.realHeight)}cm)`).join('\n')}`;
                  const textarea = document.createElement('textarea');
                  textarea.value = dummyText;
                  document.body.appendChild(textarea);
                  textarea.select();
                  document.execCommand('copy');
                  document.body.removeChild(textarea);
                  alert('📋 배치 목록 텍스트가 클립보드에 가상 복사되었습니다!\n\n' + dummyText);
                }}
                className="w-full py-2.5 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white text-xs font-bold rounded-xl transition shadow-lg shadow-indigo-500/10 flex items-center justify-center gap-1"
              >
                💾 배치 리스트 텍스트로 내보내기
              </button>
              <button
                onClick={() => {
                  alert('📸 이미지 저장 기능 시뮬레이션: 현재 배치한 방의 구도가 데이터베이스에 임시로 저장되었습니다. (MVP 버전 완성)');
                }}
                className="w-full py-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 text-xs font-bold rounded-xl transition"
              >
                📸 현재 레이아웃 저장하기
              </button>
            </div>

          </section>

        </main>
      )}

      {/* 3. 가상 인앱 스토어(제휴사 뷰) 모달 */}
      {showStoreModal && (
        <div className="fixed inset-0 z-[100] flex flex-col bg-slate-950/60 backdrop-blur-md animate-[fadeIn_0.2s_ease-out]">
          {/* 가상 스토어 헤더 */}
          <div className="bg-white text-slate-900 px-6 py-4 flex items-center justify-between border-b shadow-sm relative">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center text-white font-bold text-xs shadow-md">
                O
              </div>
              <div>
                <h2 className="font-extrabold text-base tracking-tight leading-none">오늘의집 x SpaceFit</h2>
                <p className="text-[10px] text-slate-500 mt-1">
                  배치한 가구와 완벽하게 호환되는 베스트 상품을 만나보세요.
                </p>
              </div>
            </div>
            <button 
              onClick={() => setShowStoreModal(false)}
              className="w-10 h-10 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-full font-bold text-slate-600 transition"
            >
              ✕
            </button>
          </div>
          
          {/* 스토어 본문 그리드 */}
          <div className="flex-1 overflow-y-auto p-6">
            <div className="max-w-6xl mx-auto space-y-6">
              <h3 className="text-xl font-bold text-white flex items-center gap-2">
                ✨ 내 방 사이즈에 딱 맞는 맞춤 추천
              </h3>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                {/* 기존 MOCK 데이터에 가짜 상품들을 덧붙여 풍부한 그리드 생성 */}
                {[
                  ...COMMERCE_MOCK_DATA[furnitureList.find(i => i.id === selectedId)?.type || 'unknown'],
                  ...COMMERCE_MOCK_DATA['unknown'],
                  ...COMMERCE_MOCK_DATA[furnitureList.find(i => i.id === selectedId)?.type || 'unknown'],
                  ...COMMERCE_MOCK_DATA['unknown'],
                  ...COMMERCE_MOCK_DATA['unknown']
                ].slice(0, 10).map((prod, idx) => (
                  <a
                    key={idx}
                    href="https://ohou.se"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="bg-white rounded-xl overflow-hidden shadow-lg hover:-translate-y-1 transition duration-300 group block"
                  >
                    <div className="aspect-square bg-slate-100 relative overflow-hidden">
                      <img src={prod.img} alt={prod.name} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                      <div className="absolute bottom-2 left-2 px-1.5 py-0.5 bg-red-500 text-white text-[9px] font-bold rounded shadow">
                        특가
                      </div>
                    </div>
                    <div className="p-3">
                      <div className="text-[10px] text-slate-500 font-medium mb-1">{prod.brand}</div>
                      <div className="text-xs text-slate-800 font-semibold leading-tight line-clamp-2 h-8">
                        {prod.name} (선택 치수 호환)
                      </div>
                      <div className="mt-2 flex items-center justify-between">
                        <span className="text-sm font-extrabold text-blue-600">{prod.price}</span>
                        <span className="text-[10px] text-slate-400 font-medium bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200">제휴상품</span>
                      </div>
                    </div>
                  </a>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
